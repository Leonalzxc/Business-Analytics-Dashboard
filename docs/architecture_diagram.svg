<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800">
<rect width="100%" height="100%" fill="white"/>
<text x="600" y="70" font-size="38" font-family="Arial" font-weight="bold" text-anchor="middle">Архитектура проекта</text>
<style>
.box { fill:#f4f4f4; stroke:#000; stroke-width:3; }
.label { font-family:Arial; font-size:28px; text-anchor:middle; dominant-baseline:middle; }
.arrow { stroke:#000; stroke-width:3; marker-end:url(#arrowhead); }
</style>
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="5" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="black"/>
</marker>
</defs>
<rect class="box" x="450" y="130" width="300" height="70" rx="18"/>
<text class="label" x="600" y="165">Пользователь</text>
<line class="arrow" x1="600" y1="208" x2="600" y2="248"/>
<rect class="box" x="450" y="260" width="300" height="70" rx="18"/>
<text class="label" x="600" y="295">Интерфейс</text>
<line class="arrow" x1="600" y1="338" x2="600" y2="378"/>
<rect class="box" x="450" y="390" width="300" height="70" rx="18"/>
<text class="label" x="600" y="425">Загрузка данных</text>
<line class="arrow" x1="600" y1="468" x2="600" y2="508"/>
<rect class="box" x="450" y="520" width="300" height="70" rx="18"/>
<text class="label" x="600" y="555">Обработка данных</text>
<line class="arrow" x1="600" y1="598" x2="600" y2="638"/>
<rect class="box" x="450" y="650" width="300" height="70" rx="18"/>
<text class="label" x="600" y="685">Графики и отчёты</text>
<text x="80" y="760" font-size="22" font-family="Arial">Business Analytics Dashboard</text>
</svg>
